const TOPN = 15, ROW = 38, FRAME_MS = 420;
const chart = document.getElementById('chart');
const dateEl = document.createElement('div'); dateEl.id = 'date';

chart.style.height = (TOPN * ROW) + 'px';
const rows = {};

function draw(f) {
  dateEl.textContent = f.label;
  const top = f.bars.slice(0, TOPN);
  const max = Math.max(1, top.length ? top[0].v : 1);
  const present = new Set();
  top.forEach((b, i) => {
    present.add(b.n);
    let r = rows[b.n];
    if (!r) {
      r = document.createElement('div'); r.className = 'row';
      r.style.transform = 'translateY(' + (i * ROW) + 'px)';
      const bar = document.createElement('div'); bar.className = 'bar';

      chart.appendChild(r); rows[b.n] = r;

  });
  for (const n in rows) if (!present.has(n)) rows[n].style.opacity = 0;
}

function play() {
