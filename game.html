<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTO Game</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#0f1117; color:#e1e4e8; padding:2rem 1rem; }
  #wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:1.5rem; color:#fff; text-align:center; }
  .sub { text-align:center; color:#8b949e; font-size:.85rem; margin:.4rem 0 .25rem; }
  .sub a { color:#58a6ff; text-decoration:none; }
  .rule { text-align:center; color:#8b949e; font-size:.8rem; margin:.75rem 0; }
  .ends { display:flex; justify-content:space-between; font-size:.72rem;
          color:#6e7681; text-transform:uppercase; letter-spacing:.05em; margin:.25rem .2rem; }
  #list { list-style:none; }
  .item { display:flex; align-items:center; gap:.6rem; background:#161b22;
          border:1px solid #30363d; border-left-width:5px; border-radius:10px;
          padding:.8rem .9rem; margin:.5rem 0; cursor:grab; user-select:none;
          transition:background .2s, border-color .2s; }
  .item:active { cursor:grabbing; }
  .item.locked { cursor:default; border-color:#2ea043; background:#132a1b; }
  .badge { font-size:1.1rem; width:1.4rem; text-align:center; }
  .who { font-weight:600; flex:1; }
  .peek { font-size:.72rem; color:#8b949e; }
  .days { font-variant-numeric:tabular-nums; font-weight:700; color:#58a6ff; }
  .sortable-ghost { opacity:.35; }
  .ctrl { display:flex; gap:.6rem; margin-top:1rem; }
  button { flex:1; background:#161b22; color:#e1e4e8; border:1px solid #30363d;
           border-radius:8px; padding:.6rem; font-size:.9rem; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#58a6ff; }
  button:disabled { opacity:.5; cursor:default; }
  #submit { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  .guesses { text-align:center; margin:.75rem 0; font-size:.9rem; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%;
         background:#30363d; margin:0 3px; }
  .dot.used { background:#f85149; }
  #msg { text-align:center; min-height:1.4rem; font-weight:600; margin-top:.5rem; }
</style></head><body>
<div id="wrap">
  <h1>PTO Game</h1>
  <p class="sub">Rank 5 mystery coworkers by PTO &middot; <a href="index.html">&larr; Dashboard</a></p>
  <p class="rule">Drag to rank by cumulative PTO taken. Tap a card to peek at their team. You get 4 guesses.</p>
  <div class="ends"><span>&#8593; Least PTO</span><span>Most PTO &#8595;</span></div>
  <ul id="list"></ul>
  <div class="guesses" id="guesses"></div>
  <div class="ctrl">
    <button id="newgame">New game</button>
    <button id="submit">Submit</button>
  </div>
  <div id="msg"></div>
</div>
<script>
const POOL = [{"n": "Person 57", "v": 28.6, "c": "#484f58", "t": "Former"}, {"n": "Person 44", "v": 18.0, "c": "#484f58", "t": "Former"}, {"n": "Person 11", "v": 13.2, "c": "#484f58", "t": "Former"}, {"n": "Person 17", "v": 41.5, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 49", "v": 57.0, "c": "#484f58", "t": "Former"}, {"n": "Person 14", "v": 25.4, "c": "#484f58", "t": "Former"}, {"n": "Person 15", "v": 32.5, "c": "#58a6ff", "t": "Management"}, {"n": "Person 38", "v": 36.2, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 9", "v": 56.5, "c": "#f778ba", "t": "Sales"}, {"n": "Person 35", "v": 37.7, "c": "#f778ba", "t": "Sales"}, {"n": "Person 42", "v": 8.8, "c": "#484f58", "t": "Former"}, {"n": "Person 13", "v": 0.2, "c": "#484f58", "t": "Former"}, {"n": "Person 27", "v": 56.4, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 43", "v": 0.2, "c": "#484f58", "t": "Former"}, {"n": "Person 21", "v": 7.5, "c": "#484f58", "t": "Former"}, {"n": "Person 31", "v": 36.6, "c": "#484f58", "t": "Former"}, {"n": "Person 5", "v": 46.1, "c": "#f778ba", "t": "Sales"}, {"n": "Person 50", "v": 22.5, "c": "#484f58", "t": "Former"}, {"n": "Person 12", "v": 30.3, "c": "#484f58", "t": "Former"}, {"n": "Person 36", "v": 45.6, "c": "#484f58", "t": "Former"}, {"n": "Person 1", "v": 46.2, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 28", "v": 10.6, "c": "#484f58", "t": "Former"}, {"n": "Person 60", "v": 43.2, "c": "#f778ba", "t": "Sales"}, {"n": "Person 52", "v": 22.0, "c": "#484f58", "t": "Former"}, {"n": "Person 18", "v": 26.0, "c": "#484f58", "t": "Former"}, {"n": "Person 59", "v": 50.4, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 58", "v": 37.0, "c": "#238636", "t": "Product"}, {"n": "Person 24", "v": 6.5, "c": "#484f58", "t": "Former"}, {"n": "Person 29", "v": 30.5, "c": "#484f58", "t": "Former"}, {"n": "Person 8", "v": 11.4, "c": "#484f58", "t": "Former"}, {"n": "Person 26", "v": 60.8, "c": "#238636", "t": "Product"}, {"n": "Person 10", "v": 10.9, "c": "#484f58", "t": "Former"}, {"n": "Person 23", "v": 8.0, "c": "#484f58", "t": "Former"}, {"n": "Person 30", "v": 32.0, "c": "#484f58", "t": "Former"}, {"n": "Person 7", "v": 19.0, "c": "#484f58", "t": "Former"}, {"n": "Person 19", "v": 34.5, "c": "#f778ba", "t": "Sales"}, {"n": "Person 33", "v": 31.2, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 16", "v": 38.7, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 54", "v": 3.5, "c": "#484f58", "t": "Former"}, {"n": "Person 40", "v": 7.0, "c": "#484f58", "t": "Former"}, {"n": "Person 4", "v": 25.6, "c": "#f778ba", "t": "Sales"}, {"n": "Person 20", "v": 8.0, "c": "#484f58", "t": "Former"}, {"n": "Person 22", "v": 32.6, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 51", "v": 41.4, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 46", "v": 30.8, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 37", "v": 30.6, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 47", "v": 24.5, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 41", "v": 14.1, "c": "#238636", "t": "Product"}, {"n": "Person 56", "v": 29.4, "c": "#484f58", "t": "Former"}, {"n": "Person 45", "v": 9.0, "c": "#484f58", "t": "Former"}, {"n": "Person 3", "v": 31.8, "c": "#484f58", "t": "Former"}, {"n": "Person 39", "v": 20.8, "c": "#238636", "t": "Product"}, {"n": "Person 6", "v": 6.2, "c": "#238636", "t": "Product"}, {"n": "Person 53", "v": 9.4, "c": "#484f58", "t": "Former"}, {"n": "Person 25", "v": 14.0, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 2", "v": 0.1, "c": "#484f58", "t": "Former"}, {"n": "Person 48", "v": 7.0, "c": "#f778ba", "t": "Sales"}, {"n": "Person 55", "v": 9.9, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 32", "v": 1.0, "c": "#484f58", "t": "Former"}, {"n": "Person 34", "v": 1.0, "c": "#484f58", "t": "Former"}];           // [{n, v, c, t}]
const listEl = document.getElementById('list');
const msgEl = document.getElementById('msg');
let correctVals, guesses, lockedEl, sortable;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function newGame(){
  const pick = shuffle([...POOL]).slice(0,5);
  correctVals = pick.map(x=>x.v).sort((a,b)=>a-b);
  guesses = 4; lockedEl = Array(5).fill(null);
  msgEl.textContent = '';
  document.getElementById('submit').disabled = false;
  listEl.innerHTML = '';
  shuffle(pick).forEach(p=>{
    const li = document.createElement('li');
    li.className = 'item';
    li.style.borderLeftColor = p.c;
    li.dataset.v = p.v; li.dataset.t = p.t;
    li.innerHTML = `<span class="badge">&#9776;</span><span class="who">${p.n}</span>`+
                   `<span class="peek"></span><span class="days"></span>`;
    li.addEventListener('click', ()=>{
      const pk = li.querySelector('.peek');
      pk.textContent = pk.textContent ? '' : p.t;
    });
    listEl.appendChild(li);
  });
  renderGuesses();
  if(sortable) sortable.destroy();
  sortable = Sortable.create(listEl, {animation:150, filter:'.locked', ghostClass:'sortable-ghost'});
}

function enforce(){
  const dom = [...listEl.children];
  const movable = dom.filter(el=>!el.classList.contains('locked'));
  let mi = 0;
  for(let i=0;i<5;i++){
    listEl.appendChild(lockedEl[i] || movable[mi++]);
  }
}

function renderGuesses(){
  let s = '';
  for(let i=0;i<4;i++) s += `<span class="dot ${i<(4-guesses)?'used':''}"></span>`;
  document.getElementById('guesses').innerHTML = s + `  ${guesses} left`;
}

function submit(){
  const rows = [...listEl.children];
  let newlyLocked = 0;
  rows.forEach((li,i)=>{
    const badge = li.querySelector('.badge');
    if(li.classList.contains('locked')) return;
    if(Number(li.dataset.v) === correctVals[i]){
      li.classList.add('locked');
      badge.textContent = '\u2713';
      lockedEl[i] = li;
      newlyLocked++;
    } else {
      badge.textContent = '\uD83C\uDF34';   // palm tree
    }
  });
  enforce();
  const won = lockedEl.every(Boolean);
  if(won){ finish(true); return; }
  guesses--;
  renderGuesses();
  if(guesses===0) finish(false);
}

function finish(won){
  document.getElementById('submit').disabled = true;
  [...listEl.children].forEach(li=>{
    li.querySelector('.days').textContent = Number(li.dataset.v).toFixed(1)+'d';
    if(!li.classList.contains('locked')) li.querySelector('.badge').textContent = '\uD83C\uDF34';
  });
  if(sortable) sortable.option('disabled', true);
  msgEl.style.color = won ? '#2ea043' : '#f85149';
  msgEl.textContent = won ? 'Nailed the order! \uD83C\uDF89' : 'Out of guesses. Here are the totals.';
}

document.getElementById('newgame').onclick = newGame;
document.getElementById('submit').onclick = submit;
newGame();
</script></body></html>
