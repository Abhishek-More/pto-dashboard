<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTO Game</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1/Sortable.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#0f1117; color:#e1e4e8; padding:2rem 1rem; }
  #wrap { max-width:460px; margin:0 auto; }
  h1 { font-size:1.5rem; color:#fff; text-align:center; }
  .sub { text-align:center; color:#8b949e; font-size:.85rem; margin:.4rem 0 .25rem; }
  .sub a { color:#58a6ff; text-decoration:none; }
  .rule { text-align:center; color:#8b949e; font-size:.8rem; margin:.75rem 0; }
  .ends { display:flex; justify-content:space-between; font-size:.72rem;
          color:#6e7681; text-transform:uppercase; letter-spacing:.05em; margin:.25rem .2rem; }
  #list { list-style:none; }
  .item { display:flex; align-items:center; gap:.6rem; background:#161b22;
          border:1px solid #30363d; border-left-width:5px; border-radius:10px;
          padding:.8rem .9rem; margin:.5rem 0; cursor:grab; user-select:none;
          transition:background .2s, border-color .2s; }
  .item:active { cursor:grabbing; }
  .item.locked { cursor:default; border-color:#2ea043; background:#132a1b; }
  .badge { font-size:1.1rem; width:1.4rem; text-align:center; }
  .who { font-weight:600; flex:1; }
  .peek { font-size:.72rem; color:#8b949e; }
  .sortable-ghost { opacity:.35; }
  .ctrl { display:flex; gap:.6rem; margin-top:1rem; }
  button { flex:1; background:#161b22; color:#e1e4e8; border:1px solid #30363d;
           border-radius:8px; padding:.6rem; font-size:.9rem; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#58a6ff; }
  button:disabled { opacity:.5; cursor:default; }
  #submit { background:#1f6feb; border-color:#1f6feb; color:#fff; font-weight:600; }
  .guesses { text-align:center; margin:.75rem 0; font-size:.9rem; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%;
         background:#30363d; margin:0 3px; }
  .dot.used { background:#f85149; }
  #msg { text-align:center; min-height:1.4rem; font-weight:600; margin-top:.5rem; }
</style></head><body>
<div id="wrap">
  <h1>PTO Game</h1>
  <p class="sub">Rank 5 mystery coworkers by PTO</p>
  <p class="rule">Drag to rank by cumulative PTO taken. Tap a card to peek at their team. You get 4 guesses.</p>
  <div class="ends"><span>&#8593; Most PTO</span><span>Least PTO &#8595;</span></div>
  <ul id="list"></ul>
  <div class="guesses" id="guesses"></div>
  <div class="ctrl">
    <button id="newgame">New game</button>
    <button id="submit">Submit</button>
  </div>
  <div id="msg"></div>
</div>
<script>
const POOL = [{"n": "Person 44", "r": 29, "c": "#484f58", "t": "Former"}, {"n": "Person 46", "r": 19, "c": "#484f58", "t": "Former"}, {"n": "Person 12", "r": 17, "c": "#484f58", "t": "Former"}, {"n": "Person 18", "r": 47, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 51", "r": 52, "c": "#484f58", "t": "Former"}, {"n": "Person 30", "r": 26, "c": "#484f58", "t": "Former"}, {"n": "Person 27", "r": 37, "c": "#58a6ff", "t": "Management"}, {"n": "Person 52", "r": 46, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 50", "r": 51, "c": "#f778ba", "t": "Sales"}, {"n": "Person 36", "r": 44, "c": "#f778ba", "t": "Sales"}, {"n": "Person 59", "r": 8, "c": "#484f58", "t": "Former"}, {"n": "Person 7", "r": 1, "c": "#484f58", "t": "Former"}, {"n": "Person 29", "r": 54, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 45", "r": 1, "c": "#484f58", "t": "Former"}, {"n": "Person 19", "r": 6, "c": "#484f58", "t": "Former"}, {"n": "Person 5", "r": 39, "c": "#484f58", "t": "Former"}, {"n": "Person 4", "r": 49, "c": "#f778ba", "t": "Sales"}, {"n": "Person 39", "r": 24, "c": "#484f58", "t": "Former"}, {"n": "Person 48", "r": 31, "c": "#484f58", "t": "Former"}, {"n": "Person 37", "r": 48, "c": "#484f58", "t": "Former"}, {"n": "Person 15", "r": 50, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 17", "r": 14, "c": "#484f58", "t": "Former"}, {"n": "Person 34", "r": 45, "c": "#f778ba", "t": "Sales"}, {"n": "Person 54", "r": 23, "c": "#484f58", "t": "Former"}, {"n": "Person 2", "r": 27, "c": "#484f58", "t": "Former"}, {"n": "Person 61", "r": 53, "c": "#f0883e", "t": "Implementation"}, {"n": "Person 60", "r": 41, "c": "#238636", "t": "Product"}, {"n": "Person 25", "r": 4, "c": "#484f58", "t": "Former"}, {"n": "Person 31", "r": 32, "c": "#484f58", "t": "Former"}, {"n": "Person 9", "r": 16, "c": "#484f58", "t": "Former"}, {"n": "Person 28", "r": 55, "c": "#238636", "t": "Product"}, {"n": "Person 3", "r": 15, "c": "#484f58", "t": "Former"}, {"n": "Person 10", "r": 7, "c": "#484f58", "t": "Former"}, {"n": "Person 22", "r": 36, "c": "#484f58", "t": "Former"}, {"n": "Person 32", "r": 20, "c": "#484f58", "t": "Former"}, {"n": "Person 20", "r": 42, "c": "#f778ba", "t": "Sales"}, {"n": "Person 62", "r": 34, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 14", "r": 40, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 56", "r": 3, "c": "#484f58", "t": "Former"}, {"n": "Person 42", "r": 5, "c": "#484f58", "t": "Former"}, {"n": "Person 6", "r": 28, "c": "#f778ba", "t": "Sales"}, {"n": "Person 21", "r": 7, "c": "#484f58", "t": "Former"}, {"n": "Person 23", "r": 38, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 53", "r": 43, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 40", "r": 35, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 16", "r": 33, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 49", "r": 25, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 43", "r": 21, "c": "#238636", "t": "Product"}, {"n": "Person 58", "r": 30, "c": "#484f58", "t": "Former"}, {"n": "Person 47", "r": 9, "c": "#484f58", "t": "Former"}, {"n": "Person 1", "r": 35, "c": "#484f58", "t": "Former"}, {"n": "Person 8", "r": 22, "c": "#238636", "t": "Product"}, {"n": "Person 11", "r": 10, "c": "#238636", "t": "Product"}, {"n": "Person 55", "r": 11, "c": "#484f58", "t": "Former"}, {"n": "Person 24", "r": 18, "c": "#d2a8ff", "t": "Success"}, {"n": "Person 13", "r": 0, "c": "#484f58", "t": "Former"}, {"n": "Person 38", "r": 13, "c": "#f778ba", "t": "Sales"}, {"n": "Person 57", "r": 12, "c": "#bc8cff", "t": "Marketing"}, {"n": "Person 33", "r": 2, "c": "#484f58", "t": "Former"}, {"n": "Person 35", "r": 2, "c": "#484f58", "t": "Former"}, {"n": "Person 41", "r": 5, "c": "#484f58", "t": "Former"}, {"n": "Person 26", "r": 1, "c": "#484f58", "t": "Former"}];           // [{n, r, c, t}]  r = ordering rank (no amounts)
const listEl = document.getElementById('list');
const msgEl = document.getElementById('msg');
let correctRanks, guesses, lockedEl, sortable;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function newGame(){
  const pick = shuffle([...POOL]).slice(0,5);
  correctRanks = pick.map(x=>x.r).sort((a,b)=>b-a);
  guesses = 4; lockedEl = Array(5).fill(null);
  msgEl.textContent = '';
  document.getElementById('submit').disabled = false;
  listEl.innerHTML = '';
  shuffle(pick).forEach(p=>{
    const li = document.createElement('li');
    li.className = 'item';
    li.style.borderLeftColor = p.c;
    li.dataset.r = p.r; li.dataset.t = p.t;
    li.innerHTML = `<span class="badge">&#9776;</span><span class="who">${p.n}</span>`+
                   `<span class="peek"></span>`;
    li.addEventListener('click', ()=>{
      const pk = li.querySelector('.peek');
      pk.textContent = pk.textContent ? '' : p.t;
    });
    listEl.appendChild(li);
  });
  renderGuesses();
  if(sortable) sortable.destroy();
  sortable = Sortable.create(listEl, {animation:150, filter:'.locked', ghostClass:'sortable-ghost'});
}

function enforce(){
  const dom = [...listEl.children];
  const movable = dom.filter(el=>!el.classList.contains('locked'));
  let mi = 0;
  for(let i=0;i<5;i++){
    listEl.appendChild(lockedEl[i] || movable[mi++]);
  }
}

function renderGuesses(){
  let s = '';
  for(let i=0;i<4;i++) s += `<span class="dot ${i<(4-guesses)?'used':''}"></span>`;
  document.getElementById('guesses').innerHTML = s + `  ${guesses} left`;
}

function submit(){
  const rows = [...listEl.children];
  rows.forEach((li,i)=>{
    if(li.classList.contains('locked')) return;
    const badge = li.querySelector('.badge');
    if(Number(li.dataset.r) === correctRanks[i]){
      li.classList.add('locked');
      badge.textContent = '\u2713';
      lockedEl[i] = li;
    } else {
      badge.textContent = '\uD83C\uDF34';   // palm tree
    }
  });
  enforce();
  if(lockedEl.every(Boolean)){ finish(true); return; }
  guesses--;
  renderGuesses();
  if(guesses===0) finish(false);
}

function finish(won){
  document.getElementById('submit').disabled = true;
  if(!won){
    // reveal the correct order (no amounts, just ranking)
    const rows = [...listEl.children].sort((a,b)=>Number(b.dataset.r)-Number(a.dataset.r));
    rows.forEach(r=>{ listEl.appendChild(r); r.classList.add('locked');
                      r.querySelector('.badge').textContent = '\u2713'; });
  }
  if(sortable) sortable.option('disabled', true);
  msgEl.style.color = won ? '#2ea043' : '#f85149';
  msgEl.textContent = won ? 'Nailed the order! \uD83C\uDF89' : "Out of guesses \u2014 here's the ranking.";
}

document.getElementById('newgame').onclick = newGame;
document.getElementById('submit').onclick = submit;
newGame();
</script></body></html>
