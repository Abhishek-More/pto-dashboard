<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTO Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    padding: 2rem;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 0.25rem;
  }
  h1 {
    font-size: 1.8rem;
    color: #fff;
  }
  .controls {
    position: absolute;
    right: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .year-select {
    background: #161b22;
    color: #e1e4e8;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    outline: none;
  }
  .year-select:hover {
    border-color: #58a6ff;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    color: #8b949e;
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle-label input {
    accent-color: #58a6ff;
    cursor: pointer;
  }
  .subtitle {
    text-align: center;
    color: #8b949e;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .card.wide {
    grid-column: 1 / -1;
  }
  .card h2 {
    font-size: 1rem;
    color: #8b949e;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chart-container {
    position: relative;
    width: 100%;
  }
  .chart-container.tall {
    height: 500px;
  }
  .chart-container.medium {
    height: 350px;
  }
  .stat-row {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    text-align: center;
    min-width: 160px;
  }
  .stat .value {
    font-size: 2rem;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat .label {
    font-size: 0.8rem;
    color: #8b949e;
    margin-top: 0.25rem;
  }
  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: #8b949e;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 1rem; }
    .header { flex-direction: column; gap: 0.5rem; }
    .controls { position: static; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>PTO Dashboard</h1>
  <div class="controls">
    <label class="toggle-label">
      <input type="checkbox" id="formerToggle"> Include former
    </label>
    <select class="year-select" id="yearSelect"></select>
  </div>
</div>
<p class="subtitle">Anonymous team PTO analysis (current employees only)</p>

<div class="stat-row">
  <div class="stat">
    <div class="value" id="statMembers">-</div>
    <div class="label">Team Members</div>
  </div>
  <div class="stat">
    <div class="value" id="statEvents">-</div>
    <div class="label">PTO Events</div>
  </div>
  <div class="stat">
    <div class="value" id="statTotal">-</div>
    <div class="label">Total Days Taken</div>
  </div>
  <div class="stat">
    <div class="value" id="statAvg">-</div>
    <div class="label">Avg Days / Person</div>
  </div>
</div>

<div class="grid">

  <div class="card wide">
    <h2>PTO by Person (days)</h2>
    <div id="personLegend" class="legend"></div>
    <div class="chart-container tall">
      <canvas id="personChart"></canvas>
    </div>
  </div>

  <div class="card wide">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h2 id="teamChartTitle" style="margin-bottom:0">PTO by Team (avg days / person)</h2>
      <label class="toggle-label">
        <input type="checkbox" id="teamTotalToggle"> Show total
      </label>
    </div>
    <div class="chart-container medium">
      <canvas id="teamChart"></canvas>
    </div>
  </div>

  <div class="card wide">
    <h2>Monthly Team PTO (days)</h2>
    <div class="chart-container medium">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Day of Week Distribution</h2>
    <div class="chart-container medium">
      <canvas id="dowChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>PTO Block Length</h2>
    <div class="chart-container medium">
      <canvas id="blockChart"></canvas>
    </div>
  </div>

</div>

const TC = DATA.teamColors;

Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

let personChart, teamChart, monthlyChart, dowChart, blockChart;
const formerToggle = document.getElementById('formerToggle');

function render() {
  const year = document.getElementById('yearSelect').value;
  const pool = formerToggle.checked ? 'all' : 'current';
  const d = DATA[pool][year];

  // Stats
  document.getElementById('statMembers').textContent = d.stats.members;
  document.getElementById('statEvents').textContent = d.stats.events;
  document.getElementById('statTotal').textContent = d.stats.totalDays;
  document.getElementById('statAvg').textContent = d.stats.avgDays;

  // Team color legend
  const legendEl = document.getElementById('personLegend');
  const teamsInYear = [...new Set(d.persons.map(p => p.team))].sort();
  legendEl.innerHTML = teamsInYear.map(t =>
    `<span class="legend-item"><span class="legend-dot" style="background:${TC[t]}"></span>${t}</span>`
  ).join('');

  // Person chart (colored by team, with projection overlay)
  if (personChart) personChart.destroy();
  const hasProjection = d.persons.some(p => p.projected > p.days);
  const personDatasets = [{
    label: 'Taken',
    data: d.persons.map(p => p.days),
    backgroundColor: d.persons.map(p => TC[p.team] || '#58a6ff'),
    borderRadius: 4,
  }];
  if (hasProjection) {
    personDatasets.push({
      label: 'Projected',
      data: d.persons.map(p => Math.max(0, p.projected - p.days)),
      backgroundColor: d.persons.map(p => {
        const c = TC[p.team] || '#58a6ff';
        return c + '33';
      }),
      borderColor: d.persons.map(p => TC[p.team] || '#58a6ff'),
      borderWidth: 1,
      borderDash: [4, 4],
      borderRadius: 4,
    });
  }
  personChart = new Chart(document.getElementById('personChart'), {
    type: 'bar',
    data: {
      labels: d.persons.map(p => p.name),
      datasets: personDatasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: hasProjection },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const p = d.persons[ctx.dataIndex];
              if (ctx.datasetIndex === 1) return `Projected total: ${p.projected}d`;
              return `${p.team}: ${p.days}d`;
            }
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, title: { display: true, text: 'Days' } }
      }
    }
  });

  // Team chart
  const showTotal = document.getElementById('teamTotalToggle').checked;
  const teamsSorted = [...d.teams].sort((a, b) =>
    showTotal ? b.totalDays - a.totalDays : b.avgDays - a.avgDays
  );
  document.getElementById('teamChartTitle').textContent =
    showTotal ? 'PTO by Team (total days)' : 'PTO by Team (avg days / person)';
  if (teamChart) teamChart.destroy();
  teamChart = new Chart(document.getElementById('teamChart'), {
    type: 'bar',
    data: {
      labels: teamsSorted.map(t => `${t.team} (${t.members})`),
      datasets: [{
        label: showTotal ? 'Total Days' : 'Avg Days/Person',
        data: teamsSorted.map(t => showTotal ? t.totalDays : t.avgDays),
        backgroundColor: teamsSorted.map(t => TC[t.team] || '#58a6ff'),
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const t = teamsSorted[ctx.dataIndex];
              return `Avg: ${t.avgDays}d / Total: ${t.totalDays}d / ${t.members} people`;
            }
          }
        }
      },
      scales: {
        x: { title: { display: true, text: showTotal ? 'Total Days' : 'Avg Days per Person' } },
        y: { grid: { display: false } }
      }
    }
  });

  // Monthly chart
  if (monthlyChart) monthlyChart.destroy();
  const moLabels = d.monthly.map(m => {
    const [y, mo] = m.month.split('-');
    return new Date(y, mo-1).toLocaleDateString('en', { month: 'short' });
  });
  monthlyChart = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels: moLabels,
      datasets: [{
        label: 'Team PTO Days',
        data: d.monthly.map(m => m.days),
        backgroundColor: '#58a6ff',
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Days' } }
      }
    }
  });

  // Day of week
  if (dowChart) dowChart.destroy();
  dowChart = new Chart(document.getElementById('dowChart'), {
    type: 'bar',
    data: {
      labels: d.dayOfWeek.map(x => x.day),
      datasets: [{
        label: 'Days',
        data: d.dayOfWeek.map(x => x.days),
        backgroundColor: '#f0883e',
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Total Days' } }
      }
    }
  });

  // Block length
  if (blockChart) blockChart.destroy();
  blockChart = new Chart(document.getElementById('blockChart'), {
    type: 'doughnut',
    data: {
      labels: d.blockLength.map(x => x.bucket),
      datasets: [{
        data: d.blockLength.map(x => x.count),
        backgroundColor: ['#8b949e','#58a6ff','#238636','#f0883e','#bc8cff','#f778ba'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

// Populate dropdown
const select = document.getElementById('yearSelect');
DATA.years.slice().reverse().forEach(y => {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  select.appendChild(opt);
});

select.addEventListener('change', render);
formerToggle.addEventListener('change', render);
document.getElementById('teamTotalToggle').addEventListener('change', render);
render();
</script>
