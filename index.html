<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTO Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    padding: 2rem;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 0.25rem;
  }
  h1 {
    font-size: 1.8rem;
    color: #fff;
  }
  .year-select {
    position: absolute;
    right: 0;
    background: #161b22;
    color: #e1e4e8;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    outline: none;
  }
  .year-select:hover {
    border-color: #58a6ff;
  }
  .subtitle {
    text-align: center;
    color: #8b949e;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .card.wide {
    grid-column: 1 / -1;
  }
  .card h2 {
    font-size: 1rem;
    color: #8b949e;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chart-container {
    position: relative;
    width: 100%;
  }
  .chart-container.tall {
    height: 500px;
  }
  .chart-container.medium {
    height: 350px;
  }
  .stat-row {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    text-align: center;
    min-width: 160px;
  }
  .stat .value {
    font-size: 2rem;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat .label {
    font-size: 0.8rem;
    color: #8b949e;
    margin-top: 0.25rem;
  }
  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: #8b949e;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 1rem; }
    .header { flex-direction: column; gap: 0.5rem; }
    .year-select { position: static; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>PTO Dashboard</h1>
  <select class="year-select" id="yearSelect"></select>
</div>
<p class="subtitle">Anonymous team PTO analysis (current employees only)</p>

<div class="stat-row">
  <div class="stat">
    <div class="value" id="statMembers">-</div>
    <div class="label">Team Members</div>
  </div>
  <div class="stat">
    <div class="value" id="statEvents">-</div>
    <div class="label">PTO Events</div>
  </div>
  <div class="stat">
    <div class="value" id="statTotal">-</div>
    <div class="label">Total Days Taken</div>
  </div>
  <div class="stat">
    <div class="value" id="statAvg">-</div>
    <div class="label">Avg Days / Person</div>
  </div>
</div>

<div class="grid">

  <div class="card wide">
    <h2>PTO by Person (days)</h2>
    <div id="personLegend" class="legend"></div>
    <div class="chart-container tall">
      <canvas id="personChart"></canvas>
    </div>
  </div>

  <div class="card wide">
    <h2>PTO by Team (avg days / person)</h2>
    <div class="chart-container medium">
      <canvas id="teamChart"></canvas>
    </div>
  </div>

  <div class="card wide">
    <h2>Monthly Team PTO (days)</h2>
    <div class="chart-container medium">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Day of Week Distribution</h2>
    <div class="chart-container medium">
      <canvas id="dowChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>PTO Block Length</h2>
    <div class="chart-container medium">
      <canvas id="blockChart"></canvas>
    </div>
  </div>

</div>

<script>

lDays": 108.8, "members": 5, "avgDays": 21.8}, {"team": "Success", "totalDays": 38.0, "members": 2, "avgDays": 19.0}, {"team": "Implementation", "totalDays": 53.9, "members": 3, "avgDays": 18.0}, {"team": "Product", "totalDays": 30.1, "members": 2, "avgDays": 15.0}], "monthly": [{"month": "2025-01", "days": 18.4}, {"month": "2025-02", "days": 11.7}, {"month": "2025-03", "days": 52.5}, {"month": "2025-04", "days": 22.6}, {"month": "2025-05", "days": 41.0}, {"month": "2025-06", "days": 42.0}, {"month": "2025-07", "days": 38.5}, {"month": "2025-08", "days": 27.6}, {"month": "2025-09", "days": 29.1}, {"month": "2025-10", "days": 44.0}, {"month": "2025-11", "days": 21.2}, {"month": "2025-12", "days": 20.0}], "dayOfWeek": [{"day": "Mon", "days": 73.0}, {"day": "Tue", "days": 57.3}, {"day": "Wed", "days": 59.6}, {"day": "Thu", "days": 78.8}, {"day": "Fri", "days": 108.5}], "blockLength": [{"bucket": "Half day", "count": 33}, {"bucket": "1 day", "count": 93}, {"bucket": "2-3 days", "count": 49}, {"bucket": "4-5 days", "count": 12}, {"bucket": "1-2 weeks", "count": 9}, {"bucket": "2+ weeks", "count": 3}], "stats": {"members": 18, "events": 199, "totalDays": 377, "avgDays": 21.0}}, "2026": {"persons": [{"name": "Person 10", "days": 18.0, "team": "Management", "projected": 41.9}, {"name": "Person 19", "days": 15.0, "team": "Success", "projected": 35.0}, {"name": "Person 18", "days": 10.2, "team": "Management", "projected": 23.8}, {"name": "Person 12", "days": 9.0, "team": "Sales", "projected": 21.0}, {"name": "Person 1", "days": 8.0, "team": "Sales", "projected": 18.6}, {"name": "Person 4", "days": 7.3, "team": "Success", "projected": 17.0}, {"name": "Person 8", "days": 6.6, "team": "Management", "projected": 15.4}, {"name": "Person 9", "days": 5.0, "team": "Product", "projected": 11.7}, {"name": "Person 17", "days": 5.0, "team": "Sales", "projected": 11.7}, {"name": "Person 6", "days": 5.0, "team": "Marketing", "projected": 11.7}, {"name": "Person 16", "days": 5.0, "team": "Implementation", "projected": 10.0}, {"name": "Person 13", "days": 4.0, "team": "Product", "projected": 9.3}, {"name": "Person 15", "days": 4.0, "team": "Implementation", "projected": 9.3}, {"name": "Person 3", "days": 4.0, "team": "Sales", "projected": 9.3}, {"name": "Person 7", "days": 4.0, "team": "Success", "projected": 9.3}, {"name": "Person 2", "days": 2.2, "team": "Sales", "projected": 5.1}, {"name": "Person 11", "days": 2.2, "team": "Management", "projected": 5.1}, {"name": "Person 5", "days": 2.0, "team": "Management", "projected": 4.7}, {"name": "Person 14", "days": 2.0, "team": "Sales", "projected": 4.7}], "teams": [{"team": "Success", "totalDays": 26.3, "members": 3, "avgDays": 8.8}, {"team": "Management", "totalDays": 39.1, "members": 5, "avgDays": 7.8}, {"team": "Marketing", "totalDays": 5.0, "members": 1, "avgDays": 5.0}, {"team": "Sales", "totalDays": 30.2, "members": 6, "avgDays": 5.0}, {"team": "Implementation", "totalDays": 9.0, "members": 2, "avgDays": 4.5}, {"team": "Product", "totalDays": 9.0, "members": 2, "avgDays": 4.5}], "monthly": [{"month": "2026-01", "days": 30.4}, {"month": "2026-02", "days": 26.6}, {"month": "2026-03", "days": 26.0}, {"month": "2026-04", "days": 18.2}, {"month": "2026-05", "days": 20.0}, {"month": "2026-06", "days": 4.0}, {"month": "2026-07", "days": 2.0}, {"month": "2026-08", "days": 0.0}, {"month": "2026-09", "days": 0.0}, {"month": "2026-10", "days": 0.0}, {"month": "2026-11", "days": 0.0}, {"month": "2026-12", "days": 0.0}], "dayOfWeek": [{"day": "Mon", "days": 25.8}, {"day": "Tue", "days": 14.3}, {"day": "Wed", "days": 14.3}, {"day": "Thu", "days": 27.7}, {"day": "Fri", "days": 36.6}], "blockLength": [{"bucket": "Half day", "count": 7}, {"bucket": "1 day", "count": 23}, {"bucket": "2-3 days", "count": 17}, {"bucket": "4-5 days", "count": 8}, {"bucket": "1-2 weeks", "count": 2}, {"bucket": "2+ weeks", "count": 0}], "stats": {"members": 19, "events": 57, "totalDays": 119, "avgDays": 6.2}}, "years": ["2024", "2025", "2026"], "teamColors": {"Management": "#58a6ff", "Implementation": "#f0883e", "Marketing": "#bc8cff", "Product": "#238636", "Sales": "#f778ba", "Success": "#d2a8ff"}, "generatedAt": "2026-06-05"};
const TC = DATA.teamColors;

Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

let personChart, teamChart, monthlyChart, dowChart, blockChart;

function renderYear(year) {
  const d = DATA[year];

  // Stats
  document.getElementById('statMembers').textContent = d.stats.members;
  document.getElementById('statEvents').textContent = d.stats.events;
  document.getElementById('statTotal').textContent = d.stats.totalDays;
  document.getElementById('statAvg').textContent = d.stats.avgDays;

  // Team color legend
  const legendEl = document.getElementById('personLegend');
  const teamsInYear = [...new Set(d.persons.map(p => p.team))].sort();
  legendEl.innerHTML = teamsInYear.map(t =>
    `<span class="legend-item"><span class="legend-dot" style="background:${TC[t]}"></span>${t}</span>`
  ).join('');

  // Person chart (colored by team, with projection overlay)
  if (personChart) personChart.destroy();
  const hasProjection = d.persons.some(p => p.projected > p.days);
  const personDatasets = [{
    label: 'Taken',
    data: d.persons.map(p => p.days),
    backgroundColor: d.persons.map(p => TC[p.team] || '#58a6ff'),
    borderRadius: 4,
  }];
  if (hasProjection) {
    personDatasets.push({
      label: 'Projected',
      data: d.persons.map(p => Math.max(0, p.projected - p.days)),
      backgroundColor: d.persons.map(p => {
        const c = TC[p.team] || '#58a6ff';
        return c + '33';
      }),
      borderColor: d.persons.map(p => TC[p.team] || '#58a6ff'),
      borderWidth: 1,
      borderDash: [4, 4],
      borderRadius: 4,
    });
  }
  personChart = new Chart(document.getElementById('personChart'), {
    type: 'bar',
    data: {
      labels: d.persons.map(p => p.name),
      datasets: personDatasets,
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: hasProjection },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const p = d.persons[ctx.dataIndex];
              if (ctx.datasetIndex === 1) return `Projected total: ${p.projected}d`;
              return `${p.team}: ${p.days}d`;
            }
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, title: { display: true, text: 'Days' } }
      }
    }
  });

  // Team chart
  if (teamChart) teamChart.destroy();
  teamChart = new Chart(document.getElementById('teamChart'), {
    type: 'bar',
    data: {
      labels: d.teams.map(t => `${t.team} (${t.members})`),
      datasets: [{
        label: 'Avg Days/Person',
        data: d.teams.map(t => t.avgDays),
        backgroundColor: d.teams.map(t => TC[t.team] || '#58a6ff'),
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const t = d.teams[ctx.dataIndex];
              return `Avg: ${t.avgDays}d / Total: ${t.totalDays}d / ${t.members} people`;
            }
          }
        }
      },
      scales: {
        x: { title: { display: true, text: 'Avg Days per Person' } },
        y: { grid: { display: false } }
      }
    }
  });

  // Monthly chart
  if (monthlyChart) monthlyChart.destroy();
  const moLabels = d.monthly.map(m => {
    const [y, mo] = m.month.split('-');
    return new Date(y, mo-1).toLocaleDateString('en', { month: 'short' });
  });
  monthlyChart = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels: moLabels,
      datasets: [{
        label: 'Team PTO Days',
        data: d.monthly.map(m => m.days),
        backgroundColor: '#58a6ff',
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Days' } }
      }
    }
  });

  // Day of week
  if (dowChart) dowChart.destroy();
  dowChart = new Chart(document.getElementById('dowChart'), {
    type: 'bar',
    data: {
      labels: d.dayOfWeek.map(x => x.day),
      datasets: [{
        label: 'Days',
        data: d.dayOfWeek.map(x => x.days),
        backgroundColor: '#f0883e',
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Total Days' } }
      }
    }
  });

  // Block length
  if (blockChart) blockChart.destroy();
  blockChart = new Chart(document.getElementById('blockChart'), {
    type: 'doughnut',
    data: {
      labels: d.blockLength.map(x => x.bucket),
      datasets: [{
        data: d.blockLength.map(x => x.count),
        backgroundColor: ['#8b949e','#58a6ff','#238636','#f0883e','#bc8cff','#f778ba'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

// Populate dropdown
const select = document.getElementById('yearSelect');
DATA.years.slice().reverse().forEach(y => {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  select.appendChild(opt);
});

select.addEventListener('change', () => renderYear(select.value));
renderYear(DATA.years[DATA.years.length - 1]);
</script>

</body>
</html>
