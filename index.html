<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTO Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    padding: 2rem;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 0.25rem;
  }
  h1 {
    font-size: 1.8rem;
    color: #fff;
  }
  .year-select {
    position: absolute;
    right: 0;
    background: #161b22;
    color: #e1e4e8;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    cursor: pointer;
    outline: none;
  }
  .year-select:hover {
    border-color: #58a6ff;
  }
  .subtitle {
    text-align: center;
    color: #8b949e;
    margin-bottom: 2rem;
    font-size: 0.9rem;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .card.wide {
    grid-column: 1 / -1;
  }
  .card h2 {
    font-size: 1rem;
    color: #8b949e;
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chart-container {
    position: relative;
    width: 100%;
  }
  .chart-container.tall {
    height: 500px;
  }
  .chart-container.medium {
    height: 350px;
  }
  .stat-row {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }
  .stat {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    text-align: center;
    min-width: 160px;
  }
  .stat .value {
    font-size: 2rem;
    font-weight: 700;
    color: #58a6ff;
  }
  .stat .label {
    font-size: 0.8rem;
    color: #8b949e;
    margin-top: 0.25rem;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 1rem; }
    .header { flex-direction: column; gap: 0.5rem; }
    .year-select { position: static; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>PTO Dashboard</h1>
  <select class="year-select" id="yearSelect"></select>
</div>
<p class="subtitle">Anonymous team PTO analysis</p>

<div class="stat-row">
  <div class="stat">
    <div class="value" id="statMembers">-</div>
    <div class="label">Team Members</div>
  </div>
  <div class="stat">
    <div class="value" id="statEvents">-</div>
    <div class="label">PTO Events</div>
  </div>
  <div class="stat">
    <div class="value" id="statTotal">-</div>
    <div class="label">Total Days Taken</div>
  </div>
  <div class="stat">
    <div class="value" id="statAvg">-</div>
    <div class="label">Avg Days / Person</div>
  </div>
</div>

<div class="grid">

  <div class="card wide">
    <h2>PTO by Person (days)</h2>
    <div class="chart-container tall">
      <canvas id="personChart"></canvas>
    </div>
  </div>

  <div class="card wide">
    <h2>Monthly Team PTO (days)</h2>
    <div class="chart-container medium">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Day of Week Distribution</h2>
    <div class="chart-container medium">
      <canvas id="dowChart"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>PTO Block Length</h2>
    <div class="chart-container medium">
      <canvas id="blockChart"></canvas>
    </div>
  </div>

</div>

rson 15", "days": 0.5}], "monthly": [{"month": "2025-01", "days": 49.2}, {"month": "2025-02", "days": 32.8}, {"month": "2025-03", "days": 80.1}, {"month": "2025-04", "days": 64.1}, {"month": "2025-05", "days": 77.0}, {"month": "2025-06", "days": 68.0}, {"month": "2025-07", "days": 81.3}, {"month": "2025-08", "days": 67.1}, {"month": "2025-09", "days": 55.0}, {"month": "2025-10", "days": 62.4}, {"month": "2025-11", "days": 48.2}, {"month": "2025-12", "days": 55.6}], "dayOfWeek": [{"day": "Mon", "days": 152.4}, {"day": "Tue", "days": 119.4}, {"day": "Wed", "days": 116.2}, {"day": "Thu", "days": 143.8}, {"day": "Fri", "days": 222.4}], "blockLength": [{"bucket": "Half day", "count": 75}, {"bucket": "1 day", "count": 191}, {"bucket": "2-3 days", "count": 79}, {"bucket": "4-5 days", "count": 30}, {"bucket": "1-2 weeks", "count": 23}, {"bucket": "2+ weeks", "count": 4}], "stats": {"members": 48, "events": 402, "totalDays": 754, "avgDays": 15.7}}, "2026": {"persons": [{"name": "Person 3", "days": 29.4}, {"name": "Person 54", "days": 25.0}, {"name": "Person 49", "days": 18.2}, {"name": "Person 14", "days": 18.0}, {"name": "Person 15", "days": 16.0}, {"name": "Person 27", "days": 15.0}, {"name": "Person 26", "days": 10.2}, {"name": "Person 9", "days": 9.9}, {"name": "Person 11", "days": 9.4}, {"name": "Person 36", "days": 9.2}, {"name": "Person 13", "days": 9.0}, {"name": "Person 19", "days": 8.0}, {"name": "Person 46", "days": 7.4}, {"name": "Person 4", "days": 7.3}, {"name": "Person 55", "days": 6.6}, {"name": "Person 57", "days": 6.3}, {"name": "Person 40", "days": 6.0}, {"name": "Person 52", "days": 5.0}, {"name": "Person 5", "days": 5.0}, {"name": "Person 29", "days": 5.0}, {"name": "Person 45", "days": 5.0}, {"name": "Person 58", "days": 5.0}, {"name": "Person 31", "days": 4.6}, {"name": "Person 56", "days": 4.0}, {"name": "Person 17", "days": 4.0}, {"name": "Person 33", "days": 4.0}, {"name": "Person 23", "days": 4.0}, {"name": "Person 18", "days": 3.9}, {"name": "Pers Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

let personChart, monthlyChart, dowChart, blockChart;

function renderYear(year) {
  const d = DATA[year];

  // Stats
  document.getElementById('statMembers').textContent = d.stats.members;
  document.getElementById('statEvents').textContent = d.stats.events;
  document.getElementById('statTotal').textContent = d.stats.totalDays;
  document.getElementById('statAvg').textContent = d.stats.avgDays;

  // Person chart
  if (personChart) personChart.destroy();
  personChart = new Chart(document.getElementById('personChart'), {
    type: 'bar',
    data: {
      labels: d.persons.map(p => p.name),
      datasets: [{
        label: 'Days',
        data: d.persons.map(p => p.days),
        backgroundColor: '#238636',
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Days' } }
      }
    }
  });

  // Monthly chart
  if (monthlyChart) monthlyChart.destroy();
  const moLabels = d.monthly.map(m => {
    const [y, mo] = m.month.split('-');
    return new Date(y, mo-1).toLocaleDateString('en', { month: 'short' });
  });
  monthlyChart = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels: moLabels,
      datasets: [{
        label: 'Team PTO Days',
        data: d.monthly.map(m => m.days),
        backgroundColor: '#58a6ff',
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Days' } }
      }
    }
  });

  // Day of week
  if (dowChart) dowChart.destroy();
  dowChart = new Chart(document.getElementById('dowChart'), {
    type: 'bar',
    data: {
      labels: d.dayOfWeek.map(x => x.day),
      datasets: [{
        label: 'Days',
        data: d.dayOfWeek.map(x => x.days),
        backgroundColor: '#f0883e',
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { title: { display: true, text: 'Total Days' } }
      }
    }
  });

  // Block length
  if (blockChart) blockChart.destroy();
  blockChart = new Chart(document.getElementById('blockChart'), {
    type: 'doughnut',
    data: {
      labels: d.blockLength.map(x => x.bucket),
      datasets: [{
        data: d.blockLength.map(x => x.count),
        backgroundColor: ['#8b949e','#58a6ff','#238636','#f0883e','#bc8cff','#f778ba'],
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right' }
      }
    }
  });
}

// Populate dropdown
const select = document.getElementById('yearSelect');
DATA.years.slice().reverse().forEach(y => {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  select.appendChild(opt);
});

select.addEventListener('change', () => renderYear(select.value));
renderYear(DATA.years[DATA.years.length - 1]);
</script>

</body>
</html>
